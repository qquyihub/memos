name = "cfmemos"
main = "worker/src/index.ts"
compatibility_date = "2025-05-01"
keep_vars = true

[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/file/*", "/u/*", "/explore/rss.xml"]

[vars]
INSTANCE_NAME = "cfmemos"
APP_VERSION = "1.0.0"

[[d1_databases]]
binding = "DB"
database_name = "memos"
# 不写入 database_id：Cloudflare Git 导入部署时会自动创建并绑定 D1。
# 本地/CI 部署请执行 `npm run cf:setup`，脚本会按名称查找或创建数据库，
# 并将真实 ID 写入被 Git 忽略的 wrangler.local.toml。

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "memos"
# Cloudflare Git 导入部署时会自动创建并绑定该 R2 存储桶。
# 如需改名，可设置 CFMEMOS_R2_BUCKET 后执行 `npm run cf:setup`。

# 可选 KV 缓存，默认关闭（不创建、不绑定）。
# 需要使用 KV 时，取消下面两行注释，然后执行 `npm run cf:setup`；
# 脚本会按 CFMEMOS_KV_NAME（默认 memos-cache）查找或创建命名空间，
# 并把真实 id 写入被 Git 忽略的 wrangler.local.toml。
#[[kv_namespaces]]
#binding = "CACHE"

[ai]
binding = "AI"
