name = "cfmemos"
main = "worker/src/index.ts"
compatibility_date = "2025-05-01"
keep_vars = true

[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/file/*", "/u/*", "/explore/rss.xml"]

[vars]
INSTANCE_NAME = "cfmemos"
APP_VERSION = "1.0.0"

# 默认只使用 D1。D1 / R2 / KV 的资源名称均可通过部署变量覆盖，默认都是 memos：
#   CFMEMOS_D1_NAME    D1 数据库名称，默认 memos
#   CFMEMOS_R2_BUCKET  R2 存储桶名称，默认 memos
#   CFMEMOS_KV_NAME    KV 命名空间名称，默认 memos
# R2 与 KV 默认不创建、不绑定；需要时分别设置 CFMEMOS_ENABLE_R2=true /
# CFMEMOS_ENABLE_KV=true，再执行 `npm run cf:setup`（或 `npm run cf:deploy`），
# 脚本会把对应绑定写入被 Git 忽略的 wrangler.local.toml。
[[d1_databases]]
binding = "DB"
database_name = "memos"
# 仓库配置不保存真实 database_id：Cloudflare Git 导入部署会按 database_name
# 自动创建并绑定 D1。本地/CI 部署请执行 `npm run cf:setup`，脚本会按名称
# 查找或创建数据库，并把真实 ID 写入被 Git 忽略的 wrangler.local.toml。

[ai]
binding = "AI"
