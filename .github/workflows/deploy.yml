name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm install

      - name: Install frontend dependencies
        run: cd web && npm install

      - name: Build frontend
        run: npm run build:web

      - name: Resolve repository version
        id: repository_version
        run: node scripts/fetch-github-version.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_VERSION_OWNER: usememos
          GITHUB_VERSION_REPO: memos

      # 默认只创建/绑定 D1；设置 CFMEMOS_ENABLE_R2 / CFMEMOS_ENABLE_KV 后按需创建 R2 / KV。
      # 资源名称可用 CFMEMOS_D1_NAME / CFMEMOS_R2_BUCKET / CFMEMOS_KV_NAME 覆盖，默认均为 memos。
      - name: Create, bind, initialize and deploy
        run: node scripts/cloudflare-deploy.mjs deploy --skip-build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          APP_VERSION: ${{ steps.repository_version.outputs.version }}
          CFMEMOS_ENABLE_R2: ${{ vars.CFMEMOS_ENABLE_R2 }}
          CFMEMOS_ENABLE_KV: ${{ vars.CFMEMOS_ENABLE_KV }}
          CFMEMOS_D1_NAME: ${{ vars.CFMEMOS_D1_NAME }}
          CFMEMOS_R2_BUCKET: ${{ vars.CFMEMOS_R2_BUCKET }}
          CFMEMOS_KV_NAME: ${{ vars.CFMEMOS_KV_NAME }}
