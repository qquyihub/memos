name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm install

      - name: Install frontend dependencies
        run: cd web && npm install

      - name: Build frontend
        run: npm run build:web

      - name: Resolve repository version
        id: repository_version
        run: node scripts/fetch-github-version.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_VERSION_OWNER: jkjoy
          GITHUB_VERSION_REPO: memos-on-cloudflare

      # 按名称查找或创建 D1 / R2，生成 wrangler.local.toml，执行迁移、
      # 写入 JWT_SECRET 并部署。已存在的资源与 Secret 会被复用。
      - name: Create, bind, initialize and deploy
        run: node scripts/cloudflare-deploy.mjs deploy --skip-build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          APP_VERSION: ${{ steps.repository_version.outputs.version }}
